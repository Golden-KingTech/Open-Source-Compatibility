name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Open Source Compatibility.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install...
        2. Run...
        3. See...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: shell
