[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-compatibility"
version = "0.2.0"
description = "A lightweight CLI for checking project compatibility across environments."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Golden-KingTech"}
]
keywords = ["compatibility", "open-source", "cli", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osc-check = "open_source_compatibility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
